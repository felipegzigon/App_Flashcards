<div class="title">
    <h1>Add Card</h1>
</div>
<div class="content">
    <form action="" method="get">
        <div class="field">
            <label for="type">Type</label>
            <select name="type" id="type" class="type">
                <option value="basic">Basic</option>
                <option value="basic-reverse">Basic and Reversed</option>
            </select>
        </div>

        <div class="field">
            <label for="deck">Deck</label>
            <input type="text" name="deck" id="deck" class="deck">
        </div>

        <div class="field">
            <label for="front">Front</label>
            <input type="text" name="front" id="front" class="front">
        </div>

        <div class="field">
            <label for="back">Back</label>
            <input type="text" name="back" id="back" class="back">
        </div>

        <button type="submit" class="add-button">Add</button>
    </form>
</div>
